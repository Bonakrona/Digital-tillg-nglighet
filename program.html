<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <nav class="Navbar">
        <ul>
            <li class="Logo">Logo</li>
            <li class="Home"><a href="home.html">Home</a></li>
            <li class="Start"><a href="#">Start</a></li>
        </ul>
    </nav>

    <div id="settings" class="child">

        <h1>Settings</h1>

        <p>
            <strong>Paste your chosen text here:</strong>
            <br>
            <textarea id="textarea" class="textarea resize-ta"></textarea>
        </p>


        <button id="getTestText">Get Text</button>


        <p><strong>Textsize:</strong>
            <span class="input-wrap">
                <span class="width-machine" aria-hidden="true"></span>
                <input id="sizeEntered" class="input" value="34" type="number" max="99" min="1"></span>
        </p>


        <label for="fontSelect"><strong>Font:</strong></label>
        <select id="selectFont">
            <option value="Times New Roman" selected>Times New Roman</option>
            <option value="Arial">Arial</option>
            <option value="Sans Serif">Sans Serif</option>
            <option value="Comic Sans MS">Comic Sans MS</option>
            <option value="Courier New">Courier New</option>
            <option value="Verdana">Verdana</option>
            <option value="Trebuchet MS">Trebuchet MS</option>
            <option value="Arial Black">Arial Black</option>
            <option value="Impact">Impact</option>
            <option value="Bookman">Bookman</option>
            <option value="Garamond">Garamond</option>
            <option value="Palatino">Palatino</option>
            <option value="Georgia">Georgia</option>
        </select>


        <p><strong>Pace:</strong>
            <span class="input-wrap">
                <span class="width-machine" aria-hidden="true"></span>
                <input id="paceEntered" class="input" value="3" type="number" max="20" min="1">
            </span>
        </p>

        <p><strong>Line-height:</strong>
            <span class="input-wrap">
                <span class="width-machine" aria-hidden="true"></span>
                <input id="lineHeightEntered" class="input" value="2" type="number" max="10" min="1">
            </span>
        </p>


        <label for="color-picker"><strong>Text Color:</strong></label>
        <input type="color" value="#000000" id="textColor" class="colors" />

        <label for="color-picker"><strong>Background Color:</strong></label>
        <input type="color" value="#ffffff" id="bgColor" class="colors" />

        <label for="color-picker"><strong>Highlight Color:</strong></label>
        <input type="color" value="#ffff00" id="highlightColor" class="colors" />


        <!--<div>
                <label><strong>Moving option</strong>
                    <input type="checkbox" id="slidingWords" class="options" />
                    <span class="checkmark"></span>
                </label>
                
                <label><strong>Mark Option</strong>
                    <input type="checkbox" id="highlightWords" class="options" />
                    <span class="checkmark"></span>
                </label>
            </div>-->
        <br>
        <br>    

        <div>
            <label class="options"><strong>Moving option</strong> - show five words at a time
                <input type="checkbox" id="slidingWords" />
                <span class="checkmark"></span>
            </label>

            <label class="options"><strong>One word option</strong> - show one word at a time
                <input type="checkbox" id="oneWordOption" />
                <span class="checkmark"></span>
            </label>

            <label class="options"><strong>Mark Option</strong> - show the whole text
                <input type="checkbox" id="highlightWords" />
                <span class="checkmark"></span>
            </label>
        </div>


        <!--samma sätt som font-->
        <label for="nbrOfWordsButton" id="nbrOfWordsLabel">Highlighted words in Mark Option: </label>
        <select id="nbrOfWordsButton">
            <option value="wholeText" selected>Whole text</option>
            <option value="oneWord">One word</option>
        </select>
    </div>


    <div id="running" class="child">

        <h1>Run the program</h1>

        <button id="startButton" class="runButtons">Start
            <!--<img src="Images/back.png" height="25" width="25" style="vertical-align: -3px;"/>-->
        </button>
        <button id="pauseButton" class="runButtons">
            <img src="Images/pause1.png" height="22" style="vertical-align: -3px;"/>  Pause
        </button>
        <button id="backButton" class="runButtons">
            <img src="Images/back.png" height="22" style="vertical-align: -3px;"/>  5 words
        </button>
        <button id="expandButton" class="runButtons">
            <img src="Images/expand1.png" height="22"  style="vertical-align: -3px;"/> Expand
        </button>

    </div>

    <script src="Script.js"></script>
    <script src="options.js"></script>
    <script src="Highlight.js"></script>
    <script src="SlidingWords.js"></script>
    <script src="Pause.js"></script>
    <script src="nbrOfWordsHighlighted.js"></script>
    <script src="ExpandProgram.js"></script>
    <script src="oneWordReader.js"></script>

</body>

</html>
